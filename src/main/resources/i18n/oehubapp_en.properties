app.settings.fwdproxy.title=Forward proxy
app.settings.fwdproxy.desc=The forward proxy built into the app. When --proxy-server is on in Chrome Launcher, Chrome goes through this port. Hosts in the selected oeHosts profiles connect to their recorded IPs, and everything else uses normal DNS. There is no authentication. Restart saves the port and access setting, and restarts the proxy with them.
app.settings.fwdproxy.bind.all.warn=Because there is no authentication, anyone on the same network can use this proxy, including to reach services this PC exposes only to itself (127.0.0.1). Turn this on only on a network you trust. For other devices to connect, allow access when Windows Firewall asks.
app.settings.share.title=Share server
app.settings.share.desc=A built-in HTTP server for using oeHosts profiles with hosts managers such as SwitchHosts. Only profiles with sharing turned on are served, at http://127.0.0.1:port/hosts/..., and only this PC can connect. Restart saves the port and restarts the server on it.
app.share.tooltip=Share (SwitchHosts, etc.)
app.share.title=Share · {0}
app.share.desc=With sharing on, this profile's hosts content is available at the URL below. In SwitchHosts, add a Remote entry and enter this URL. Edits to the profile reach SwitchHosts the next time it refreshes. Only this PC can connect.
