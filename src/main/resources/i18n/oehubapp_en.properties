app.proxy.ca.guide=The certificates oeProxy issues for each domain are signed by this CA. Add the CA certificate to your trust store once so browsers can connect without warnings.<br><br>CA certificate: <code>{0}</code><br><br>Windows (administrator command prompt): <code>certutil -addstore -f Root "{0}"</code><br>macOS: <code>sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "{0}"</code><br>Firefox uses its own certificate store, so import the certificate separately under Settings → Privacy & Security → View Certificates.
