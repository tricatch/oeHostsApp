app.hosts.proxy.server.info=Launches Chrome through the app's forward proxy (127.0.0.1:{0}). Only the Chrome launched this way is affected. Even without --host-resolver-rules, hosts in the currently selected oeHosts profiles connect to their recorded IPs, and everything else uses normal DNS. You can change the port in Settings → Forward proxy.
