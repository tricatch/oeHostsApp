app.settings.fwdproxy.title=Forward proxy
app.settings.fwdproxy.desc=The forward proxy built into the app. With --proxy-server on in the Chrome launcher, Chrome goes through this port: hosts in the selected oeHosts profiles connect to the recorded IP, everything else through normal DNS. There is no account sign-in. Restart saves the port and who may connect, and restarts the proxy with them.
app.settings.fwdproxy.bind.all.warn=With no account sign-in, anyone on the same network can use this proxy, including services this PC exposes only to itself (127.0.0.1). Turn this on only on a network you trust. For other devices to connect, allow it when Windows Firewall asks.
app.hosts.proxy.server.info=Launches Chrome pointed at the app's forward proxy (127.0.0.1:{0}) for that window only. Without a --host-resolver-rules flag, hosts in your currently-selected oeHosts profiles connect to the recorded IP, and everything else follows normal DNS. The port is set in Settings → Forward proxy.
