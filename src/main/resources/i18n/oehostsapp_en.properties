app.settings.web.title=Web service
app.settings.web.desc=The HTTP server built into the app.\nIt serves the oeHosts profiles you share as hosts text.\nSwitchHosts and oeHosts-Agent download the profiles from it.\nIt also serves the page where a phone downloads the CA certificate.\nRestart saves the PC address and port, and restarts the server.
