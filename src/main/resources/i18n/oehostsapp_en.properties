modal.chrome.cmd.kill.warn.profile=If Chrome is already running with the same user data folder (--user-data-dir), you are asked first, then Chrome is asked to quit normally so your tabs are saved.\nIf Chrome has not exited after 10 seconds, it is force-closed and any unsaved work in that window is lost.
