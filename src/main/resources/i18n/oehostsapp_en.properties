app.phone.page.title=Install the oeHostsApp certificate
app.phone.page.desc=To use oeHostsApp's HTTPS domains on this phone, install the CA certificate below and set it as trusted.
app.phone.page.download=Download the CA certificate
app.phone.steps.ios=Tap the button above and allow the profile download when asked.|In Settings → General → VPN & Device Management, install the downloaded profile.|In Settings → General → About → Certificate Trust Settings, turn this certificate on.
app.phone.steps.android=Tap the button above to download the certificate file.|In Settings → Security → Encryption & credentials → Install a certificate → CA certificate, choose the downloaded file. Menu names differ between devices.
app.phone.page.note=Trusting this CA makes the phone trust every certificate oeHostsApp creates.\nRemove the certificate when you are done developing.\nAndroid apps may not trust a CA you installed yourself; browsers such as Chrome do.
app.phone.page.missing=There is no CA certificate yet.
app.settings.active.title=Active-Hosts sharing
app.settings.active.desc=One URL serves the hosts of the profiles selected in oeHosts, merged.\nPut it in tools such as the Java agent or SwitchHosts (remote hosts), and changing the selection in oeHosts moves every tool to the same development environment.\nThe default address is 127.0.0.1 (this PC). If the web service settings open it to the network, other PCs on that network can use the URL too.
