app.proxy.ca.guide=The certificates oeProxy issues for each domain are signed by this CA.<br>Add the CA certificate to your trust store once, and browsers will connect without warnings.<br><br>CA certificate: <code>{0}</code><br><br>Windows (administrator command prompt): <code>certutil -addstore -f Root "{0}"</code><br>macOS: <code>sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "{0}"</code><br><br>Firefox uses its own certificate store.<br>Import the certificate there separately under Settings → Privacy & Security → View Certificates.
