app.settings.fwdproxy.title=Forward proxy
app.settings.fwdproxy.desc=The forward proxy built into the app.\nChrome uses it when --proxy-server is on in Chrome Launcher.\nHosts in the selected oeHosts profiles connect to the IPs in the profile.\nOther domains use normal DNS.\nNo authentication is required by default.\nYou can require Basic authentication from other devices.\nRestart saves these settings and restarts the proxy.
