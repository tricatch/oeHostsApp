app.settings.ua.presets.desc=Chrome 런처의 --user-agent 프리셋 버튼에 표시할 항목입니다. 한 줄에 하나씩 {name} | {user-agent} 형식으로 입력하세요. #으로 시작하는 줄은 주석입니다.
