app.settings.url.presets.desc=Chrome 런처의 open 프리셋 버튼에 표시할 항목입니다. 한 줄에 하나씩 {name} | {url} 형식으로 입력하세요. #으로 시작하는 줄은 주석입니다.
app.settings.fwdproxy.title=포워드 프록시
app.settings.fwdproxy.desc=앱에 내장된 포워드 프록시입니다. Chrome 런처에서 --proxy-server를 켜면 Chrome이 이 포트를 거칩니다. 선택한 oeHosts 프로필에 있는 호스트는 기록된 IP로, 나머지는 일반 DNS로 연결됩니다. 별도의 인증은 없습니다. 다시 시작을 누르면 포트와 접속 범위를 저장하고 그 설정으로 프록시를 다시 시작합니다.
app.settings.fwdproxy.bind.all.warn=인증이 없으므로 같은 네트워크의 누구나 이 프록시를 쓸 수 있고, 이를 통해 이 PC에서만 열어 둔 서비스(127.0.0.1)에도 접근할 수 있습니다. 믿을 수 있는 네트워크에서만 켜세요. 다른 기기에서 접속하려면 Windows 방화벽이 물을 때 허용하세요.
app.hosts.proxy.server.info=앱의 포워드 프록시(127.0.0.1:{0})를 거치도록 Chrome을 실행하며, 이렇게 실행한 Chrome에만 적용됩니다. --host-resolver-rules 없이도 현재 선택한 oeHosts 프로필의 호스트는 기록된 IP로 연결되고, 나머지는 일반 DNS를 따릅니다. 포트는 설정 → 포워드 프록시에서 바꿀 수 있습니다.
