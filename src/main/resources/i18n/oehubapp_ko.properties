app.proxy.ca.guide=oeProxy가 도메인마다 발급하는 인증서는 이 CA로 서명됩니다. 브라우저에서 경고 없이 접속하려면 CA 인증서를 신뢰 저장소에 한 번만 등록하세요.<br><br>CA 인증서: <code>{0}</code><br><br>Windows (관리자 명령 프롬프트): <code>certutil -addstore -f Root "{0}"</code><br>macOS: <code>sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "{0}"</code><br>Firefox는 자체 인증서 저장소를 사용하므로 설정 → 개인정보 및 보안 → 인증서 보기에서 따로 가져와야 합니다.
