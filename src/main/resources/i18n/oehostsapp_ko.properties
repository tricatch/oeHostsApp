app.settings.agent.hint=애플리케이션이 시작될 때 웹 서비스가 실행 중이어야 합니다. 에이전트가 60초마다 프로필을 다시 받으므로, 고친 내용은 실행 중인 애플리케이션에 1~2분 안에 반영됩니다.
app.settings.agent.inuse=실행 중인 Java 애플리케이션이 에이전트를 쓰고 있어 새 버전으로 바꾸지 못했습니다. 그 애플리케이션들을 닫은 뒤 oeHostsApp을 다시 시작하면 새 버전이 설치됩니다.
app.settings.agent.missing=에이전트가 설치되어 있지 않습니다. 이 oeHostsApp 빌드에는 에이전트가 들어 있지 않고, 최신 릴리스도 내려받지 못했습니다. 인터넷에 연결된 상태에서 oeHostsApp을 다시 시작하세요.
app.settings.agent.failed=에이전트를 설치하지 못했습니다. 폴더 쓰기 권한을 확인하고 oeHostsApp을 다시 시작하세요.
