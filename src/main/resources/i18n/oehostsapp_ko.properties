app.settings.web.title=웹 서비스
app.settings.web.desc=앱에 내장된 HTTP 서버입니다.\n공유를 켠 oeHosts 프로필을 hosts 텍스트로 제공하고(SwitchHosts, oeHosts-Agent), 휴대폰이 CA 인증서를 받는 페이지를 제공합니다.\n다시 시작을 누르면 PC 주소와 포트를 저장하고 그 설정으로 다시 시작합니다.
