app.settings.phone.title=모바일 기기 인증서 설치
app.settings.phone.desc=휴대폰은 hosts 파일이나 DNS를 바꿀 수 없으므로, Wi-Fi 프록시를 이 PC의 포워드 프록시로 지정해 도메인이 연결될 곳을 바꿉니다. 포워드 프록시가 선택한 oeHosts 프로필에 따라 도메인을 기록된 IP로 연결합니다. 여기에 더해 oeHostsApp의 HTTPS 도메인을 쓰려면 CA 인증서를 설치해야 합니다. 기기는 포워드 프록시를 거쳐 웹 서비스의 인증서 페이지에 접속하므로, 웹 서비스는 이 PC에서만 열려 있어도 됩니다.
app.settings.phone.off=포워드 프록시가 이 PC(127.0.0.1)에서만 접속을 받거나 실행 중이 아닙니다. 휴대폰은 포워드 프록시를 거쳐 접속하므로, 포워드 프록시 설정에서 휴대폰과 같은 네트워크의 랜카드나 "모든 네트워크"를 고르고 다시 시작을 누르세요.
app.settings.phone.open.fwd=포워드 프록시 설정 열기
app.settings.phone.web.stopped=웹 서비스가 실행 중이 아닙니다. 인증서 페이지는 웹 서비스가 제공합니다.
app.settings.phone.open.web=웹 서비스 설정 열기
app.settings.phone.address=PC 주소
app.settings.phone.no.address=휴대폰이 접속할 포워드 프록시 주소가 없습니다. 포워드 프록시의 PC 주소를 휴대폰과 같은 네트워크의 랜카드(또는 모든 네트워크)로 고르세요.
app.settings.phone.ca.url=인증서 페이지
app.settings.phone.copy.url=주소 복사
app.settings.phone.steps=1. 휴대폰을 이 PC와 같은 Wi-Fi에 연결하고, Wi-Fi 설정에서 프록시를 "수동"으로 바꿔 서버 {0}, 포트 {1}을 넣습니다.\n2. 휴대폰 카메라로 QR 코드를 찍어 인증서 페이지를 열고, CA 인증서를 내려받습니다.\n3. 휴대폰에 인증서를 설치하고 신뢰하도록 설정합니다. 방법은 인증서 페이지에 나옵니다.
app.phone.page.title=oeHostsApp 인증서 설치
app.phone.page.desc=이 휴대폰에서 oeHostsApp의 HTTPS 도메인을 쓰려면 아래 CA 인증서를 설치하고 신뢰하도록 설정하세요.
app.phone.page.download=CA 인증서 내려받기
app.phone.steps.ios=위 버튼을 누르고, 프로파일을 내려받겠냐고 물으면 허용합니다.|설정 → 일반 → VPN 및 기기 관리에서 내려받은 프로파일을 설치합니다.|설정 → 일반 → 정보 → 인증서 신뢰 설정에서 이 인증서를 켭니다.
app.phone.steps.android=위 버튼을 눌러 인증서 파일을 내려받습니다.|설정 → 보안 → 암호화 및 사용자 인증 정보 → 인증서 설치 → CA 인증서를 고르고 내려받은 파일을 선택합니다. 메뉴 이름은 기종마다 다를 수 있습니다.
app.phone.page.note=이 CA를 신뢰하면 oeHostsApp이 만든 인증서를 믿게 됩니다. 개발이 끝나면 인증서를 지우세요. Android 앱은 직접 설치한 CA를 믿지 않을 수 있으며, Chrome 같은 브라우저에서는 동작합니다.
app.phone.page.missing=아직 CA 인증서가 없습니다.
app.settings.agent.title=Java 에이전트
app.settings.agent.desc=oeHosts-Agent는 공유한 oeHosts 프로필의 호스트를 Java 애플리케이션 하나에만 적용합니다. OS의 hosts 파일은 건드리지 않습니다. 아래 옵션을 애플리케이션의 JVM 옵션(java 명령줄, Gradle jvmArgs, Maven argLine, IDE의 VM options)에 넣으세요. 에이전트는 앱이 이 위치에 설치하고, 시작할 때마다 더 새 릴리스가 있으면 내려받아 바꿉니다.
