app.settings.ca.desc=CA 인증서는 처음 실행할 때 데이터 폴더에 자동으로 생성됩니다.\noeProxy는 요청받은 도메인의 HTTPS 인증서를 실시간으로 발급하고, 이 CA로 서명합니다.\n이 CA는 자체 서명 인증서이므로, 신뢰할 수 있는 루트 인증서로 등록해야 브라우저에서 경고 없이 접속할 수 있습니다.
