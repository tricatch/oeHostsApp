app.phone.page.download=CA 인증서 내려받기
app.phone.steps.ios=위 버튼을 누르고, 프로파일 다운로드를 묻는 창에서 허용을 누릅니다.|설정 → 일반 → VPN 및 기기 관리에서 내려받은 프로파일을 설치합니다.|설정 → 일반 → 정보 → 인증서 신뢰 설정에서 이 인증서를 켭니다.
app.phone.steps.android=위 버튼을 눌러 인증서 파일을 내려받습니다.|설정 → 보안 → 암호화 및 사용자 인증 정보 → 인증서 설치 → CA 인증서에서 내려받은 파일을 선택합니다. 메뉴 이름은 기종마다 다를 수 있습니다.
app.phone.page.note=이 CA를 신뢰하면 oeHostsApp이 만든 인증서를 모두 신뢰하게 됩니다.\n개발이 끝나면 인증서를 삭제하세요.\nAndroid 앱은 직접 설치한 CA를 신뢰하지 않을 수 있습니다. Chrome 같은 브라우저에서는 정상적으로 동작합니다.
