app.share.desc=공유를 켜면 이 프로필의 hosts 내용을 아래 URL에서 받을 수 있습니다. SwitchHosts에서 원격(Remote) 항목을 추가하고 이 URL을 넣으세요. 프로필을 고치면 SwitchHosts가 다음에 새로 고칠 때 반영됩니다. 다른 기기에서 받을 수 있는지는 설정 > 일반 > 웹 서비스의 PC 주소로 정합니다.
