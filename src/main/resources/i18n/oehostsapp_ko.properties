app.settings.server.desc=앱에 내장된 리버스 프록시(oeProxy)입니다.\nHTTPS(443) 요청을 받아, 선택한 가상 호스트의 도메인과 경로에 맞는 백엔드 서버로 전달합니다.\n앱과 함께 시작되며, 가상 호스트를 선택하거나 수정하면 즉시 반영됩니다.\n[다시 시작]을 누르면 수신 주소를 저장하고 프록시를 다시 시작합니다.
