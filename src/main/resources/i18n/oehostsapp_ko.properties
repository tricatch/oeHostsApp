app.settings.fwdproxy.title=프록시 서비스
app.settings.fwdproxy.desc=앱에 내장된 프록시 서비스입니다.\nChrome 실행 시 --proxy-server를 켜면 이 프록시를 거쳐 접속합니다.\n선택한 oeHosts 프로필에 있는 호스트는 매핑된 IP로, 나머지 도메인은 일반 DNS로 연결됩니다.\n공유한 hosts URL, Active-Hosts URL, 휴대폰 인증서 페이지도 같은 포트에서 제공합니다.
app.access.title=접속 요청
app.access.desc=다른 기기가 프록시 서비스에 접속하려고 합니다.\n허용하면 이 기기는 접속 기기 목록에서 삭제할 때까지 프록시와 공유 URL을 사용할 수 있습니다.
