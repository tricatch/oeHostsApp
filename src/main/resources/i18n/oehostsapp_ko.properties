app.settings.ca.import=CA 가져오기
app.settings.ca.import.desc=이미 가지고 있는 CA(예: oeHub의 CA)를 가져옵니다.<br>브라우저가 이미 신뢰하는 CA라면 다시 등록할 필요가 없습니다.<br>개인키는 PEM(PKCS#8, 암호화된 키 포함) 또는 PKCS#12(.pfx/.p12) 파일을 사용할 수 있습니다.<br>PKCS#12 파일에 인증서가 들어 있으면 인증서 파일은 비워 두어도 됩니다.
