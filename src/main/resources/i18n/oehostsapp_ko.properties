app.settings.fwdproxy.desc=앱에 내장된 포워드 프록시입니다.\nChrome 런처에서 --proxy-server를 켜면 Chrome이 이 포트를 거칩니다.\n선택한 oeHosts 프로필에 있는 호스트는 기록된 IP로, 나머지는 일반 DNS로 연결됩니다.\n기본으로 인증이 없으며, 다른 기기에 Basic 인증(사용자 이름·비밀번호)을 요구하도록 설정할 수 있습니다.\n다시 시작을 누르면 PC 주소, 포트, 인증 설정을 저장하고 그 설정으로 프록시를 다시 시작합니다.
