modal.chrome.cmd.kill.warn.profile=같은 사용자 데이터 폴더(--user-data-dir)로 실행 중인 Chrome이 있으면, 먼저 확인을 받은 뒤 탭이 저장되도록 Chrome을 정상 종료합니다.\n10초 안에 종료되지 않으면 강제로 종료하며, 그 창에서 저장하지 않은 작업은 사라집니다.
modal.chrome.cmd.kill.why=실행 옵션은 Chrome이 시작될 때만 적용됩니다.\n따라서 같은 프로필을 사용하는 Chrome이 이미 실행 중이면, Chrome을 다시 시작합니다.
